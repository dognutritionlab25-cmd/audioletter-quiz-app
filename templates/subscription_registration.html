{% extends 'base.html' %}
{% block title %}구독 등록 · 반려견영양연구소{% endblock %}
{% block content %}
<div class="admin-head"><div><p class="eyebrow">SUBSCRIPTION</p><h1>구독 등록</h1></div><a class="secondary button-link" href="{{ url_for('public_pages.subscribe') }}">구독 안내</a></div>
<p class="notice">PayApp 결제를 완료한 뒤 입력해주세요. 이 신청서를 제출하는 것만으로 유료 구독이 활성화되지는 않으며, 실제 결제내역 확인 후 등록됩니다.</p>
<form class="card form-grid" method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <fieldset class="wide form-fieldset">
    <legend>구독 개월수 <span class="required">*</span></legend>
    <div class="rating">
      {% for code, label in plans.items() %}<label class="inline"><input type="radio" name="plan_code" value="{{ code }}" {% if values.plan_code == code %}checked{% endif %} required> {{ label }}</label>{% endfor %}
    </div>
  </fieldset>
  <label>보호자 이름 <span class="required">*</span><input name="guardian_name" maxlength="100" value="{{ values.guardian_name or '' }}" autocomplete="name" required></label>
  <label>반려견 이름 <span class="required">*</span><input name="dog_name" maxlength="100" value="{{ values.dog_name or '' }}" required></label>
  <label>이메일 <span class="required">*</span><input type="email" name="email" maxlength="254" value="{{ values.email or '' }}" autocomplete="email" required></label>
  <label>보호자 연락처 <span class="required">*</span><input type="tel" name="contact_phone" maxlength="30" value="{{ values.contact_phone or '' }}" autocomplete="tel" placeholder="01012345678" required><small>구독완료 알림톡을 받을 번호입니다.</small></label>
  <label>반려견 생일 또는 입양일<input type="date" name="dog_birth_date" value="{{ values.dog_birth_date or '' }}"><small>기존 구독자는 입력하지 않아도 됩니다.</small></label>
  <label>반려견 견종<input name="dog_breed" maxlength="100" value="{{ values.dog_breed or '' }}"><small>기존 구독자는 입력하지 않아도 됩니다.</small></label>
  <label class="wide">결제자 이름<input name="payer_name" maxlength="100" value="{{ values.payer_name or '' }}"><small>보호자 이름과 다를 때만 입력해주세요.</small></label>
  <label class="wide">현재 반려견 영양과 돌봄에서 가장 관심 있는 내용<textarea name="interests" maxlength="1000" rows="5">{{ values.interests or '' }}</textarea></label>
  <fieldset class="wide form-fieldset">
    <legend>재구독 여부 <span class="required">*</span></legend>
    <div class="rating"><label class="inline"><input type="radio" name="registration_type" value="new" {% if values.registration_type == 'new' %}checked{% endif %} required> 신규</label><label class="inline"><input type="radio" name="registration_type" value="renewal" {% if values.registration_type == 'renewal' %}checked{% endif %} required> 재구독</label></div>
  </fieldset>
  <label class="wide agreement"><input type="checkbox" name="privacy_agree" value="yes" {% if values.privacy_agree == 'yes' %}checked{% endif %} required> <span><a href="{{ url_for('public_pages.privacy') }}" target="_blank" rel="noopener">개인정보 수집·이용 및 개인정보처리방침</a>을 확인하고 동의합니다. (필수)<br><small>수집 항목: 보호자 이름·연락처·이메일·결제자 이름, 반려견 이름·생일·견종, 관심 내용, 신규/재구독 및 이용권 정보<br>이용 목적: 결제 확인, 구독 등록·관리, 오디오레터 및 관련 안내 제공</small></span></label>
  <button class="primary wide" type="submit">구독 등록 신청하기</button>
</form>
{% endblock %}
