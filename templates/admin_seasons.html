{% extends 'base.html' %}
{% block content %}<h1>시즌 관리</h1><section class="card"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>코드<input name="code" required placeholder="S2"></label><label>이름<input name="title" required></label><label class="inline"><input type="checkbox" name="is_active" checked> 활성</label><button class="primary">추가</button></form></section><section class="stack">{% for s in seasons %}<div class="card row-card"><span><strong>{{ s.code }}</strong> {{ s.title }}</span><span>{{ '활성' if s.is_active else '비활성' }}</span></div>{% endfor %}</section>{% endblock %}
