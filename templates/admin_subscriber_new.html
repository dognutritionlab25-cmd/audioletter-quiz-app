{% extends 'base.html' %}
{% block content %}
<p><a href="{{ url_for('admin_subscribers') }}">← 구독자 목록</a></p>
<h1>새 구독자 등록</h1>
<section class="card">
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>이메일 주소<input type="email" name="email" autocomplete="off" required></label>
    <label>표시 이름<input name="display_name" required></label>
    <label class="inline"><input type="checkbox" name="is_active" checked> 활성 구독자</label>
    <button class="primary">등록</button>
  </form>
  <p><small>이메일 원문은 저장하지 않고 Magic Link 인증용 HMAC 값만 저장합니다.</small></p>
</section>
{% endblock %}
