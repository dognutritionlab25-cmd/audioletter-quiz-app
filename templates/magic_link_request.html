{% extends 'base.html' %}
{% block title %}이메일 인증{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">구독자 인증</p>
  <h1>이메일로 확인할게요</h1>
  <p>구독할 때 등록한 이메일을 입력하면, 한 번만 사용할 수 있는 인증 링크를 보내드립니다.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>이메일<input type="email" name="email" autocomplete="email" required></label>
    <button class="primary full">인증 메일 받기</button>
  </form>
</section>
{% endblock %}
