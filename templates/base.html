<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}반려견영양연구소{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">반려견영양연구소</a>
    <nav>
      {% if session.get('subscriber_id') %}<a href="{{ url_for('my_history') }}">나의 참여</a>{% endif %}
      {% if session.get('is_admin') %}<a href="{{ url_for('admin_dashboard') }}">관리자</a>{% endif %}
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
